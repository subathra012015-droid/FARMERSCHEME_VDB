version: '3.9'

services:
  backend:
    image: farmerscheme-backend:prod
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farmerscheme-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-farmerscheme-db}
    command: gunicorn -k uvicorn.workers.UvicornWorker backend.main:app --bind 0.0.0.0:8000 --workers 2

  frontend:
    image: farmerscheme-frontend:prod
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farmerscheme-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    command: streamlit run frontend/app.py --server.port=8501 --server.address=0.0.0.0
